<svg viewBox="0 0 680 540" width="100%" role="img">
  <title>GraphRAG 与 LightRAG 流水线对比图</title>
  <desc>并排展示 GraphRAG 和 LightRAG 在索引阶段和查询阶段的差异</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .t { font: 500 14px sans-serif; fill: #000; }
      .ts { font: 400 12px sans-serif; fill: #666; }
      .th { font: 500 14px sans-serif; fill: #000; }
      .sec { font: 500 12px sans-serif; fill: #888; letter-spacing: 0.5px; }
    </style>
  </defs>

  <rect width="680" height="540" fill="#ffffff"/>

  <text class="th" x="180" y="32" text-anchor="middle" fill="#3C3489">GraphRAG（微软）</text>
  <text class="ts" x="180" y="50" text-anchor="middle">重索引 + 社区摘要预计算</text>
  <text class="th" x="500" y="32" text-anchor="middle" fill="#085041">LightRAG（港大）</text>
  <text class="ts" x="500" y="50" text-anchor="middle">轻量图 + 双层在线检索</text>

  <line x1="340" y1="65" x2="340" y2="520" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 4" opacity="0.5"/>

  <text class="sec" x="40" y="90">INDEX 索引阶段</text>

  <g fill="#EEEDFE" stroke="#7F77DD">
    <rect x="60" y="105" width="120" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="120" y="127" text-anchor="middle" dominant-baseline="central" fill="#3C3489">抽实体关系</text>
  </g>
  <line x1="180" y1="127" x2="200" y2="127" stroke="#7F77DD" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <g fill="#EEEDFE" stroke="#7F77DD">
    <rect x="200" y="105" width="120" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="260" y="121" text-anchor="middle" dominant-baseline="central" fill="#3C3489">建图</text>
    <text class="ts" x="260" y="139" text-anchor="middle" dominant-baseline="central">entities + edges</text>
  </g>

  <g fill="#FAECE7" stroke="#D85A30">
    <rect x="60" y="170" width="120" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="120" y="184" text-anchor="middle" dominant-baseline="central" fill="#712B13">社区检测</text>
    <text class="ts" x="120" y="202" text-anchor="middle" dominant-baseline="central">Leiden 算法</text>
  </g>
  <line x1="260" y1="149" x2="180" y2="170" stroke="#D85A30" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <g fill="#FAECE7" stroke="#D85A30">
    <rect x="200" y="170" width="120" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="260" y="184" text-anchor="middle" dominant-baseline="central" fill="#712B13">社区摘要</text>
    <text class="ts" x="260" y="202" text-anchor="middle" dominant-baseline="central">LLM × N 次</text>
  </g>
  <line x1="180" y1="192" x2="200" y2="192" stroke="#D85A30" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <text class="ts" x="120" y="240" text-anchor="middle" fill="#993C1D">成本高 · 更新慢</text>

  <g fill="#E1F5EE" stroke="#1D9E75">
    <rect x="380" y="105" width="120" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="440" y="127" text-anchor="middle" dominant-baseline="central" fill="#085041">抽实体关系</text>
  </g>
  <line x1="500" y1="127" x2="520" y2="127" stroke="#1D9E75" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <g fill="#E1F5EE" stroke="#1D9E75">
    <rect x="520" y="105" width="120" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="580" y="121" text-anchor="middle" dominant-baseline="central" fill="#085041">建图</text>
    <text class="ts" x="580" y="139" text-anchor="middle" dominant-baseline="central">+ embedding</text>
  </g>
  <line x1="580" y1="149" x2="580" y2="170" stroke="#1D9E75" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <g fill="#F1EFE8" stroke="#888780">
    <rect x="450" y="170" width="260" height="44" rx="8" stroke-width="0.5" stroke-dasharray="3 3"/>
    <text class="ts" x="580" y="192" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">无社区检测 · 无摘要</text>
  </g>

  <text class="ts" x="580" y="240" text-anchor="middle" fill="#0F6E56">成本低 · 增量友好</text>

  <text class="sec" x="40" y="280">QUERY 查询阶段</text>

  <g fill="#E6F1FB" stroke="#378ADD">
    <rect x="40" y="295" width="130" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="105" y="315" text-anchor="middle" dominant-baseline="central" fill="#0C447C">Local Search</text>
    <text class="ts" x="105" y="335" text-anchor="middle" dominant-baseline="central">实体邻域</text>
  </g>
  <g fill="#E6F1FB" stroke="#378ADD">
    <rect x="210" y="295" width="130" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="275" y="315" text-anchor="middle" dominant-baseline="central" fill="#0C447C">Global Search</text>
    <text class="ts" x="275" y="335" text-anchor="middle" dominant-baseline="central">map-reduce 社区摘要</text>
  </g>

  <text class="ts" x="105" y="375" text-anchor="middle" fill="#0C447C">具体事实问答</text>
  <text class="ts" x="275" y="375" text-anchor="middle" fill="#0C447C" font-weight="500">全局归纳（主场）</text>

  <g fill="#EAF3DE" stroke="#639922">
    <rect x="380" y="295" width="130" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="445" y="315" text-anchor="middle" dominant-baseline="central" fill="#27500A">低层检索</text>
    <text class="ts" x="445" y="335" text-anchor="middle" dominant-baseline="central">关键词命中实体</text>
  </g>
  <g fill="#EAF3DE" stroke="#639922">
    <rect x="520" y="295" width="130" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="585" y="315" text-anchor="middle" dominant-baseline="central" fill="#27500A">高层检索</text>
    <text class="ts" x="585" y="335" text-anchor="middle" dominant-baseline="central">语义 embedding</text>
  </g>

  <text class="ts" x="445" y="375" text-anchor="middle" fill="#27500A" font-weight="500">具体事实（高效）</text>
  <text class="ts" x="585" y="375" text-anchor="middle" fill="#854F0B">归纳能力较弱</text>

  <line x1="40" y1="400" x2="640" y2="400" stroke="#888780" stroke-width="0.5" opacity="0.4"/>
  <text class="sec" x="40" y="425">问题类型 → 最佳方案</text>

  <g fill="#FAEEDA" stroke="#BA7517">
    <rect x="40" y="440" width="280" height="60" rx="8" stroke-width="0.5"/>
    <text class="th" x="180" y="460" text-anchor="middle" dominant-baseline="central" fill="#412402">"微软收购动视花了多少钱？"</text>
    <text class="ts" x="180" y="482" text-anchor="middle" dominant-baseline="central" fill="#854F0B">具体事实 → LightRAG 完胜（同精度，零头成本）</text>
  </g>

  <g fill="#FAECE7" stroke="#D85A30">
    <rect x="360" y="440" width="280" height="60" rx="8" stroke-width="0.5"/>
    <text class="th" x="500" y="460" text-anchor="middle" dominant-baseline="central" fill="#4A1B0C">"过去十年收购的主题趋势？"</text>
    <text class="ts" x="500" y="482" text-anchor="middle" dominant-baseline="central" fill="#993C1D">全局归纳 → GraphRAG 主场</text>
  </g>
</svg>
